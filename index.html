<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171917">
  <title>アーカイブサイト</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #171917;
      --ink: #eeece5;
      --muted: #a5a69e;
      --line: #3a3d38;
      --serif: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
      --sans: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    .page { width: min(1440px, 100%); margin-inline: auto; padding: 0 clamp(20px, 5vw, 76px); }
    header { padding: clamp(34px, 6vw, 78px) 0 25px; }
    .eyebrow {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(34px, 5vw, 62px);
      font-weight: 400;
      letter-spacing: .08em;
      line-height: 1.25;
    }
    .rule { height: 1px; margin-top: 30px; background: var(--ink); opacity: .7; }
    main { padding: clamp(28px, 4vw, 52px) 0 80px; }
    .collection-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 23px;
    }
    .collection-head h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 400;
      letter-spacing: .08em;
    }
    .count { color: var(--muted); font-size: 11px; letter-spacing: .12em; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(28px, 5vw, 64px) clamp(18px, 3vw, 40px); }
    .item { min-width: 0; }
    .photo-button {
      display: block;
      width: 100%;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: #292c28;
      cursor: zoom-in;
      text-align: left;
    }
    .photo-button img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1200 / 713;
      object-fit: cover;
      transition: transform 500ms cubic-bezier(.2,.7,.2,1);
    }
    .photo-button:hover img, .photo-button:focus-visible img { transform: scale(1.018); }
    .photo-button:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
    .caption { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 13px; }
    .name { margin: 0; font-family: var(--serif); font-size: 15px; letter-spacing: .06em; }
    .words { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: .04em; }
    footer { border-top: 1px solid var(--line); padding: 18px 0 28px; color: var(--muted); font-size: 10px; letter-spacing: .12em; }
    dialog { width: min(94vw, 1200px); max-width: none; max-height: 92vh; padding: 0; border: 0; background: transparent; }
    dialog::backdrop { background: rgb(24 25 22 / 88%); }
    dialog img { display: block; width: 100%; max-height: 84vh; object-fit: contain; }
    dialog form { position: absolute; top: 12px; right: 12px; }
    .close {
      width: 40px; height: 40px; border: 1px solid rgb(255 255 255 / 55%); border-radius: 50%;
      color: white; background: rgb(0 0 0 / 35%); font-size: 22px; cursor: pointer;
    }
    @media (max-width: 640px) {
      .page { padding-inline: 18px; }
      header { padding-top: 35px; }
      .rule { margin-top: 23px; }
      main { padding-top: 26px; }
      .grid { grid-template-columns: 1fr; gap: 31px; }
      .photo-button img { aspect-ratio: 1200 / 713; }
      .caption { padding-top: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <p class="eyebrow">Personal archive</p>
      <h1>アーカイブサイト</h1>
      <div class="rule" aria-hidden="true"></div>
    </header>
    <main>
      <div class="collection-head">
        <h2>写真</h2>
        <span class="count" id="count"></span>
      </div>
      <section class="grid" id="gallery" aria-label="写真一覧"></section>
    </main>
    <footer>アーカイブサイト</footer>
  </div>
  <dialog id="viewer" aria-label="写真を拡大表示">
    <img id="viewer-image" alt="">
    <form method="dialog"><button class="close" aria-label="閉じる">×</button></form>
  </dialog>
  <script>
    const photos = ["01.jpg", "02.jpg", "03.jpg", "04.jpg", "05.jpg"];
    const gallery = document.querySelector("#gallery");
    const viewer = document.querySelector("#viewer");
    const viewerImage = document.querySelector("#viewer-image");

    document.querySelector("#count").textContent = String(photos.length).padStart(2, "0");
    gallery.innerHTML = photos.map((file, index) => {
      const name = file.replace(/\.jpg$/i, "");
      return `
        <article class="item">
          <button class="photo-button" type="button" data-src="images/${file}" data-name="${name}" aria-label="${name} の写真を拡大">
            <img src="images/${file}" alt="${name}" loading="${index < 2 ? "eager" : "lazy"}" width="1200" height="713">
          </button>
          <div class="caption">
            <h3 class="name">${name}</h3>
            <p class="words">（ここに言葉）</p>
          </div>
        </article>`;
    }).join("");

    gallery.addEventListener("click", (event) => {
      const button = event.target.closest(".photo-button");
      if (!button) return;
      viewerImage.src = button.dataset.src;
      viewerImage.alt = button.dataset.name;
      viewer.showModal();
    });
    viewer.addEventListener("click", (event) => {
      if (event.target === viewer) viewer.close();
    });
    viewer.addEventListener("close", () => { viewerImage.removeAttribute("src"); });
  </script>
</body>
</html>
